[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kratos-visualization-tools"
version = "0.1.0"
description = "Visualization utilities for Kratos Multiphysics simulation data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.5", "numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7"]
gui = ["PySide6>=6.5"]

[project.scripts]
kratos-visualize-mdpa = "kratos_visualization_tools.cli:main"
kratos-visualize-gid = "kratos_visualization_tools.gid.cli:main"
kratos-plot-saved-results = "kratos_visualization_tools.saved_results.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
